<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Luna, mi amor eterno</title>
    <!-- Fuentes premium para un toque profesional y elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo de cielo nocturno animado */
            background: radial-gradient(circle at center, #0a0e27 0%, #03040c 100%);
            color: #f5eeda; /* Tono crema suave para texto */
            font-family: 'Cormorant Garamond', serif; /* Fuente elegante para texto */
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        /* Estrellas titilantes de fondo */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: stars-twinkle 4s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes stars-twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Corazones flotantes de fondo, más sutiles */
        .hearts-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 182, 193, 0.4);
            font-size: 15px;
            animation: floatUp 8s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.3); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }

        /* Contenedor principal premium */
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            width: 100%;
            background: rgba(10, 14, 39, 0.4); /* Fondo azul oscuro muy traslúcido */
            backdrop-filter: blur(25px); /* Efecto cristal esmerilado profundo */
            border: 1px solid rgba(255, 223, 186, 0.15); /* Borde dorado pálido sutil */
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 2s ease-out;
            border-top: 2px solid rgba(255,223,186,0.3); /* Resplandor superior */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif; /* Fuente premium cursiva */
            font-style: italic;
            font-size: 4rem;
            color: #ffe4e1; /* Color rosa muy pálido suave */
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 228, 225, 0.6), 0 0 3px rgba(255, 182, 193, 0.8);
            animation: text-glow 2s ease-in-out infinite alternate;
        }

        @keyframes text-glow {
            from { text-shadow: 0 0 20px rgba(255, 228, 225, 0.6), 0 0 3px rgba(255, 182, 193, 0.8); }
            to { text-shadow: 0 0 30px rgba(255, 228, 225, 0.8), 0 0 8px rgba(255, 182, 193, 1); }
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 1.3rem;
            color: #d8c8b0; /* Oro viejo suave */
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Galería de fotos moderna e interactiva */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }

            width: 100%;
            height: 160px;
            border-radius: 20
